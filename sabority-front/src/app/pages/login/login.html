<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🍽️</div>
    <h2>Bienvenido a Sabority</h2>
    <p class="auth-subtitle">Inicia sesión para continuar</p>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="datos.email" name="email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="datos.password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </div>
</div>
